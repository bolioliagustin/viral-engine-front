# S5: CI/CD Pipeline for YouTube Viral Content Engine
# Runs tests on push/PR, builds Docker images on merge to main

name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      
      - name: Install dependencies
        working-directory: backend
        run: npm ci
      
      - name: Run tests
        working-directory: backend
        run: npm test
        env:
          NODE_ENV: test

  test-worker:
    name: Worker Tests
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: worker/requirements.txt
      
      - name: Install dependencies
        working-directory: worker
        run: pip install -r requirements.txt && pip install pytest
      
      - name: Run tests
        working-directory: worker
        run: python -m pytest tests/ -v

  build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [test-backend, test-worker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Build backend image
        run: docker build -t viralengine-backend ./backend
      
      - name: Build worker image
        run: docker build -t viralengine-worker ./worker
      
      - name: Verify compose config
        run: docker compose config
