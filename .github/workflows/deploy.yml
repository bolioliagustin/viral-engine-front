# Deploy to OVHcloud VPS — worker only (API stays on Render)
#
# Setup once in GitHub → Settings → Secrets and variables → Actions:
#   VPS_HOST     = 51.79.50.95
#   VPS_USER     = ubuntu
#   VPS_SSH_KEY  = (private SSH key — see deploy/SETUP-DEPLOY.md)
#
# After setup: git push origin main  →  VPS updates automatically.

name: Deploy Worker to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy worker to OVH
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ~/viralengine
            git fetch origin main
            git reset --hard origin/main
            bash deploy/deploy-worker.sh
