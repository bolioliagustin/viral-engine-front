# S4: Docker Compose for YouTube Viral Content Engine
# Usage: docker compose up -d

services:
  backend:
    build: ./backend
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1) })" ]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    build: ./worker
    env_file:
      - .env
    environment:
      - ENVIRONMENT=production
      - MAX_WORKERS=2
    volumes:
      - worker_downloads:/app/downloads
      - worker_clips:/app/clips
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

volumes:
  worker_downloads:
  worker_clips:
