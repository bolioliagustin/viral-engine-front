# Render Blueprint — solo el backend API. El worker corre en el VPS de OVH
# (docker-compose.worker.yml), no en Render.

services:
  - type: web
    name: viralengine-backend
    runtime: node
    region: oregon
    plan: starter
    rootDir: backend
    buildCommand: npm ci
    startCommand: node src/index.js
    healthCheckPath: /health/live
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: SENTRY_DSN_BACKEND
        sync: false
      - key: LEMONSQUEEZY_API_KEY
        sync: false
      - key: LEMONSQUEEZY_STORE_ID
        sync: false
      - key: LEMONSQUEEZY_VARIANT_ID
        sync: false
      - key: LEMONSQUEEZY_WEBHOOK_SECRET
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: ADMIN_USER_IDS
        sync: false
      # F1 (docs/PROYECTO.md §14/§15, docs/DEPLOY_FASE0.md): faltaban acá —
      # el blueprint es lo que le da al panel de Render los campos para
      # cargarlas, así que sin esto no hay dónde pegarlas sin editar a mano.
      - key: MAX_VIDEO_MINUTES
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
