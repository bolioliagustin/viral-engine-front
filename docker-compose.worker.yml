# Worker-only — use when the API runs elsewhere (e.g. Render).
# Usage: docker compose -f docker-compose.worker.yml up -d --build
#
# Proxies: create proxies.txt in repo root (gitignored), one per line:
#   http://user:pass@host:port

services:
  worker:
    build: ./worker
    env_file:
      - .env
    environment:
      - ENVIRONMENT=production
      - USE_RAPIDAPI_DOWNLOAD=true
      - MAX_WORKERS=${MAX_WORKERS:-3}
      # Path inside container (proxies.txt is mounted below)
      - WEBSHARE_PROXY_FILE=/app/proxies.txt
    volumes:
      - worker_downloads:/app/downloads
      - worker_clips:/app/clips
      - ./proxies.txt:/app/proxies.txt:ro
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 10G

volumes:
  worker_downloads:
  worker_clips:
